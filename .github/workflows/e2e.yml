name: e2e

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 显式安装浏览器：e2e 套件依赖 chromium，缺失安装是此前 CI 长期红掉的根因。
      # 使用 playwright-core（@e2e-dev/web 的实际驱动）而非 npx playwright，
      # 保证浏览器 build（chromium v1248）与锁定版本完全一致，不产生版本漂移。
      - name: Install chromium browser
        run: npx playwright-core install --with-deps chromium

      # 模型无关（model-free）套件：无 secret、无外部网络（helpers.ts 中断一切外部请求）。
      - name: Run e2e suite
        run: E2E_TELEMETRY_DISABLED=1 npx e2e run

      - name: Upload e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .e2e/results/
          if-no-files-found: ignore
          retention-days: 14
