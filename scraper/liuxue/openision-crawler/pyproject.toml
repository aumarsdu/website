[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openision-crawler"
version = "0.1.0"
description = "Compliant crawler probe project for Openision public/authorized data."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
probe = ["playwright>=1.44"]
test = ["pytest>=8.0"]
yaml = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
