[project]
name = "sou-crawler"
version = "0.1.0"
description = "Authorized SPA API discovery and data collection crawler"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "playwright>=1.44.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sou_crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
