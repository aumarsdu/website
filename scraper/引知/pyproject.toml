[project]
name = "caoliao-authorized-archiver"
version = "0.1.0"
description = "Authorized archive crawler for a single Caoliao QR H5 live-code page and associated OpenAPI data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Local Archive Project" }]
dependencies = []

[project.scripts]
caoliao-archive = "caoliao_archiver.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
