[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanqu-posters"
version = "0.1.0"
description = "Offline OCR + rename pipeline for manually collected competitor poster images (no crawling)"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "paddleocr>=3.0.0",
]

[tool.setuptools]
py-modules = ["ocr_posters_ppocrv6", "rename_posters_by_title"]
