[project]
name = "xntj-archive"
version = "0.1.0"
description = "Authorized, resumable public archive crawler for xntj.tv"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27"]

[project.scripts]
xntj-archive = "xntj_archive.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

